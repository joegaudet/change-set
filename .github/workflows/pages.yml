name: pages

# Publishes docs/site to GitHub Pages, with the API reference built into api/. There are no
# release tags yet, so the reference is built from main.
on:
  push:
    branches: [main]
    paths:
      - 'change-set.ts'
      - 'docs/site/**'
      - 'docs/api.css'
      - 'typedoc.json'
      - 'tsconfig.docs.json'
      - 'scripts/typedoc-site.mjs'
      - 'scripts/llms-full.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:api
      - uses: actions/configure-pages@v6
      - run: |
          cp -R docs/site _site
          cp -R docs/api _site/api
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
