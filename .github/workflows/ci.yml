name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The unit tests, plus scripts/api-docs.test.mjs, which builds the API reference with
      # treatWarningsAsErrors, so an undocumented export fails CI.
      - run: npx vitest run
